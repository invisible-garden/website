# Netlify build config. The only host-specific file in the repo, everything
# else is standard Next.js so moving hosts stays cheap.

[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Pinned deliberately. The runtime is an adapter, so it can lag a new Next
# major. Upgrade Next majors only after the runtime supports them.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers live in next.config.ts, not here. A [[headers]] block in
# this file set nothing at all on 2026-08-23, on pages or on static files:
# the Next runtime is an adapter and takes over the response.
