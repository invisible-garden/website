name: CI

on:
  pull_request:
  push:
    branches: [invisible-commons]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          # No database and no secrets. The build has to pass with nothing but
          # the site URL set, that is the test that this site stays static.
          NEXT_PUBLIC_SITE_URL: https://invisiblecommons.org
