<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Invisible Commons">
  <!-- A wave on the site's own gradient. Generic on purpose: the event has no
       mark of its own, and no co-host's mark can stand in for one, since that
       would bill the event as theirs. Kept to a single stroke because a
       favicon is read at 16px in a browser tab. -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04222e"/>
      <stop offset="45%" stop-color="#0a4f57"/>
      <stop offset="100%" stop-color="#0b7c7b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sea)"/>
  <path d="M12 36q10-14 20 0t20 0" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
</svg>
